# Disposable OpenHands evaluation. A failed default-branch CI run starts a
# read-only, ephemeral repair job and uploads evidence. No PR is published.
name: Specfaro pilot repair
on:
  workflow_run:
    workflows: ["Specfaro pilot regression"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: specfaro-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.SPECFARO_OPENHANDS_EVAL_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned Specfaro worker
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://dotte.duckdns.org/specfaro-local-kit.zip -o "$RUNNER_TEMP/kit.zip"
          echo '6cd1c58651051d994ef7c0bb6fe56d712b106a0c6ec79d36acc6806d408f5a9d  '"$RUNNER_TEMP/kit.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/kit"
      - name: Install pinned OpenHands SDK
        run: python -m pip install 'openhands-sdk==1.54.0' 'openhands-tools==1.54.0'
      - name: Reproduce, repair, and independently verify
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/kit/specfaro-local-kit
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.SPECFARO_DEEPSEEK_API_KEY }}
        run: |
          python .specfaro/openhands_pilot_worker.py . \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run "${{ github.event.workflow_run.id }}" \
            --event-file "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/specfaro-result"
      - name: Summarize evaluation
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/specfaro-result/report.md"; then
            cat "$RUNNER_TEMP/specfaro-result/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specfaro-pilot-result
          path: ${{ runner.temp }}/specfaro-result/
          if-no-files-found: warn
          retention-days: 7
