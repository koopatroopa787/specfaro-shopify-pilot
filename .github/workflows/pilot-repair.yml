# Pilot for a repository owned by the installer. A failing default-branch CI run
# starts a read-only repair job; a separate job only applies its checked artifact.
name: Specfaro pilot repair
on:
  workflow_run:
    workflows: ["Specfaro pilot regression"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: specfaro-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      validated: ${{ steps.result.outputs.validated }}
      base_sha: ${{ steps.result.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned Specfaro worker
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://dotte.duckdns.org/specfaro-local-kit.zip -o "$RUNNER_TEMP/kit.zip"
          echo 'fbc4cb323fa3a87fa80c91263f16963e9b45818c48942d8551ae8d62eb556fb8  '"$RUNNER_TEMP/kit.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/kit"
      - name: Reproduce, propose, and validate
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/kit/specfaro-local-kit
        run: |
          python "$RUNNER_TEMP/kit/specfaro-local-kit/pilot_worker.py" . \
            --repository "$GITHUB_REPOSITORY" --provider shopify --version 2026-10 \
            --issue-file .specfaro/issue.txt --commands-file .specfaro/commands.json \
            --output "$RUNNER_TEMP/specfaro-result"
      - name: Record validated state
        id: result
        shell: bash
        run: |
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test -f "$RUNNER_TEMP/specfaro-result/manifest.json"; then
            echo "validated=true" >> "$GITHUB_OUTPUT"
          else
            echo "validated=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specfaro-pilot-result
          path: ${{ runner.temp }}/specfaro-result/
          if-no-files-found: warn
          retention-days: 7

  propose:
    needs: repair
    if: needs.repair.outputs.validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.base_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: specfaro-pilot-result
          path: ${{ runner.temp }}/specfaro-result
      - name: Download pinned artifact verifier
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://dotte.duckdns.org/specfaro-local-kit.zip -o "$RUNNER_TEMP/kit.zip"
          echo 'fbc4cb323fa3a87fa80c91263f16963e9b45818c48942d8551ae8d62eb556fb8  '"$RUNNER_TEMP/kit.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/kit"
      - name: Validate artifact and open draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.repair.outputs.base_sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PYTHONPATH: ${{ runner.temp }}/kit/specfaro-local-kit
        run: |
          python "$RUNNER_TEMP/kit/specfaro-local-kit/pilot_publish.py" . \
            "$RUNNER_TEMP/specfaro-result" --repository "$GITHUB_REPOSITORY" \
            --base-sha "$BASE_SHA"
          git -c core.hooksPath=/dev/null apply --check --whitespace=error \
            "$RUNNER_TEMP/specfaro-result/candidate.patch"
          git -c core.hooksPath=/dev/null apply --whitespace=error \
            "$RUNNER_TEMP/specfaro-result/candidate.patch"
          git diff --check
          branch="specfaro/pilot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -u
          git -c core.hooksPath=/dev/null commit -m 'Repair Shopify API integration regression'
          git push origin "HEAD:$branch"
          gh pr create --draft --base "$BASE_BRANCH" --head "$branch" \
            --title 'Repair Shopify API integration regression' \
            --body-file "$RUNNER_TEMP/specfaro-result/report.md"
