name: Specfaro sandbox smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tool SDK
        run: python -m pip install 'openhands-sdk==1.54.0' 'openhands-tools==1.54.0'
      - name: Check disposable Docker boundary without real credentials
        run: python .specfaro/sandbox_smoke.py
